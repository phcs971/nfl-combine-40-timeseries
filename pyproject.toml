[project]
name = "nfl-combine-40-timeseries"
version = "0.2.0"
description = "Per-frame yardage and pose time series of NFL Combine 40-yard dashes, by athlete class"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.13",
    "pandas>=2.2",
    "pyarrow>=16",
    "opencv-python-headless>=4.10",
    "ultralytics>=8.3",
    "yt-dlp>=2025.1.1",
    "matplotlib>=3.11.2",
]

[tool.uv]
package = false
